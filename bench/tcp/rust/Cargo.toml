[package]
name = "tcpbench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
